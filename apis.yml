aid: bio-rad-laboratories
name: Bio-Rad Laboratories
description: >-
  Bio-Rad Laboratories is a global leader in developing and manufacturing a wide
  range of products for the life science research and clinical diagnostic markets,
  including instruments, reagents, consumables, software, and services. Founded
  in 1952, Bio-Rad serves scientists in genomics, proteomics, cell biology,
  quality control, and clinical diagnostics with products like real-time PCR
  systems, western blotting instruments, flow cytometers, and digital PCR.
