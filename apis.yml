  - type: Features
    data:
      - name: Real-Time PCR Systems
        description: CFX Opus and CFX Duet real-time PCR instruments for gene expression and genotyping.
      - name: Digital PCR (ddPCR)
        description: QX600 and QX200 Droplet Digital PCR systems for absolute quantification.
      - name: Western Blotting
        description: ChemiDoc imaging systems and Trans-Blot turbo transfer for protein analysis.
      - name: Flow Cytometry
        description: ZE5 cell analyzer and S3e cell sorter for high-throughput cell analysis.
      - name: Electrophoresis
        description: Gel electrophoresis systems for DNA, RNA, and protein separation.
      - name: ELISA and Immunoassays
        description: Bio-Plex multiplex immunoassay systems for protein quantification.
      - name: Cell Culture
        description: TC20 automated cell counters and cell culture media and reagents.
      - name: Clinical Diagnostics
        description: D-10 hemoglobin testing system and quality controls for clinical laboratories.
      - name: Informatics Software
        description: CFX Maestro, Bio-Plex Manager, and ChromLab software for instrument data analysis.
  - type: UseCases
    data:
      - name: Genomics Research
        description: PCR, qPCR, and ddPCR for gene expression, SNP genotyping, and copy number variation.
      - name: Proteomics Analysis
        description: Western blotting, ELISA, and multiplex immunoassay for protein study.
      - name: Clinical Laboratory Testing
        description: Hemoglobin A1c, blood typing, and quality control for clinical diagnostics.
      - name: Cell Biology
        description: Flow cytometry and cell imaging for cell sorting and phenotyping.
      - name: Liquid Biopsy
        description: Digital PCR for detecting rare mutations in circulating tumor DNA.
      - name: Bioprocess Monitoring
        description: Analytical instruments and quality controls for biopharmaceutical manufacturing QC.
  - type: Integrations
    data:
      - name: LIMS Systems
        description: Bio-Rad instruments integrate with Laboratory Information Management Systems via data export.
      - name: Cloud Data Analysis
        description: Bio-Rad Connect cloud platform for remote instrument monitoring and data management.
      - name: EHR Systems
        description: Clinical diagnostic instruments connect to hospital EHR and LIS systems.
